spring.application.name=stockpilot-api
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.error.include-stacktrace=never
server.error.include-message=never

# ---- Database (all values come from the environment; no credentials in source) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stockpilot}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}

# Schema is owned by Flyway migrations (src/main/resources/db/migration)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---- Security ----
# JWT_SECRET is REQUIRED (min 32 chars). There is intentionally no default.
stockpilot.jwt.secret=${JWT_SECRET}
stockpilot.jwt.expires-minutes=${JWT_EXPIRES_MINUTES:480}
stockpilot.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
stockpilot.bcrypt-strength=${BCRYPT_STRENGTH:10}
stockpilot.rate-limit.auth-per-minute=${AUTH_RATE_LIMIT_PER_MINUTE:20}

# ---- Seed demo data on boot (idempotent). Enable on the demo deployment only. ----
stockpilot.seed.enabled=${SEED_DEMO_DATA:false}
stockpilot.seed.password=${SEED_DEMO_PASSWORD:Demo@12345}

# ---- Health endpoint only ----
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.jackson.default-property-inclusion=non_null
# 1.5 must never be silently truncated to 1 for quantity fields
spring.jackson.deserialization.accept-float-as-int=false
